spring.application.name=lekha

# ---------- Gemma ----------
langchain.lekha.gemma.baseUrl=http://localhost:11434
langchain.lekha.gemma.modelName=gemma4:e4b
langchain.lekha.gemma.topP=1.0
langchain.lekha.gemma.temperature=0.0
langchain.lekha.gemma.maxTokens=1024
langchain.lekha.gemma.maxRetries=1
langchain.lekha.gemma.requestTimeout=120

# ---------- Nemotron ----------
langchain.lekha.nemotron.baseUrl=http://localhost:11434
langchain.lekha.nemotron.modelName=nemotron-mini:4b
langchain.lekha.nemotron.topP=1.0
langchain.lekha.nemotron.temperature=0.0
langchain.lekha.nemotron.maxTokens=2048
langchain.lekha.nemotron.maxRetries=1
langchain.lekha.nemotron.requestTimeout=180

# ---------- Paddle OCR ----------
langchain.lekha.ocr.baseUrl=http://localhost:11434
langchain.lekha.ocr.modelName=hf.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF:latest
langchain.lekha.ocr.topP=1.0
langchain.lekha.ocr.temperature=0.0
langchain.lekha.ocr.maxTokens=4096
langchain.lekha.ocr.maxRetries=1
langchain.lekha.ocr.requestTimeout=180

# Constrained decoding against the DocumentInfo schema. Per model, not per Ollama version:
# gemma4:e4b returns {"error":"structured output is unavailable"}, so it stays off and falls
# back to asking for JSON in the prompt. Verify before flipping one on:
#   curl -s localhost:11434/api/chat -d '{"model":"<name>","stream":false,
#     "messages":[{"role":"user","content":"hi"}],"format":{"type":"object"}}'
langchain.lekha.gemma.structuredOutput=false
langchain.lekha.nemotron.structuredOutput=true
langchain.lekha.ocr.structuredOutput=false

# Prompt/response logging, per model. Needs the langchain4j logger at DEBUG below.
# Leave the OCR pair off unless needed: it logs the whole base64 image.
langchain.lekha.gemma.logRequests=true
langchain.lekha.gemma.logResponses=true
langchain.lekha.nemotron.logRequests=true
langchain.lekha.nemotron.logResponses=true

logging.level.dev.langchain4j=DEBUG
logging.pattern.level=%5p [${spring.application.name},%X{referenceId:-}]

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
